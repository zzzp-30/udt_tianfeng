[build-system]
requires = ["hatchling>=1.27.0", "babel>=2.17.0"]
build-backend = "hatchling.build"

[project]
name = "udt_tianfeng"
version = "0.1.0"
description = "用于紫金天风实盘账户的交易程序"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pip",
    "ipykernel",
    "akshare",  # AkShare 始终使用最新版，因为它本质是爬虫程序，修复类更新出的非常快
    "vnpy",
    "vnpy-ctp",
    "vnpy-mysql",
    "vnpy-simplestrategy",
]

[tool.uv.sources]
vnpy = { path = "../vnpy" }
vnpy-ctp = { path = "../vnpy_ctp" }
vnpy-mysql = { path = "../vnpy_mysql" }
vnpy-simplestrategy = { path = "../vnpy_simplestrategy" }

[tool.ruff]
target-version = "py313"
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
